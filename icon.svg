  <defs><path id="w" d="M118 152 L182 370 L256 236 L330 370 L394 152"/></defs>
  <rect width="512" height="512" rx="104" fill="#ff6a1f"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" transform="rotate(-6 256 256)">
    <use href="#w" stroke="#121110" stroke-width="124" transform="translate(16 18)"/>
    <use href="#w" stroke="#121110" stroke-width="124"/>
    <use href="#w" stroke="#d8cfbd" stroke-width="86"/>
    <use href="#w" stroke="#fffaf0" stroke-width="72" transform="translate(0 -7)"/>
    <path d="M110 178 L126 232" stroke="#fff" stroke-width="15"/>
  </g>
