<style>
/* The cover: a plane over a sea of clouds at dusk. The clouds drift past in three layers at
   different speeds, so the plane seems to fly. Reduced motion holds everything still. */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  min-height: 100svh; overflow: hidden; position: relative; color: #fff;
  font: 16px/1.5 "IBM Plex Sans", system-ui, sans-serif;
  background: linear-gradient(180deg, #0d2350 0%, #1d4583 34%, #4f7fc0 58%, #e8b48f 82%, #f6d3ae 100%);
}
a { color: inherit; }
.sky { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
/* A few stars, high up where it's still dark */
.stars { position: absolute; inset: 0 0 60% 0; background-image:
  radial-gradient(1.5px 1.5px at 12% 18%, #fff9 50%, transparent 51%), radial-gradient(1px 1px at 28% 9%, #fff8 50%, transparent 51%),
  radial-gradient(1.5px 1.5px at 47% 22%, #fff7 50%, transparent 51%), radial-gradient(1px 1px at 66% 12%, #fff9 50%, transparent 51%),
  radial-gradient(1.5px 1.5px at 83% 26%, #fff6 50%, transparent 51%), radial-gradient(1px 1px at 92% 7%, #fff8 50%, transparent 51%); }
.sun { position: absolute; left: 50%; bottom: 8%; width: 70vmax; height: 70vmax; transform: translate(-50%, 50%); border-radius: 50%;
  background: radial-gradient(circle, #ffe3b8cc 0%, #ffcf9a55 28%, transparent 60%); }
/* Cloud layers: each is a strip one tile wider than the screen, sliding left by one tile */
.clouds { position: absolute; left: 0; right: 0; background-repeat: repeat-x; will-change: transform; }
.far  { bottom: 22%; height: 200px; opacity: .55; }
.mid  { bottom: 6%;  height: 260px; opacity: .85; }
.near { bottom: -70px; height: 340px; }
@media (prefers-reduced-motion: no-preference) {
  .far  { animation: drift var(--dur) linear infinite; --dur: 120s; }
  .mid  { animation: drift var(--dur) linear infinite; --dur: 64s; }
  .near { animation: drift var(--dur) linear infinite; --dur: 34s; }
  .plane { animation: bob 7s ease-in-out infinite; }
  .trail { animation: shimmer 3s ease-in-out infinite; }
}
.clouds, .plane, .trail { animation-play-state: var(--play, running); }
@keyframes drift { to { transform: translateX(calc(-1 * var(--tile))); } }
@keyframes bob { 0%, 100% { transform: translate(0, 0) rotate(-1deg); } 50% { transform: translate(0, -10px) rotate(.6deg); } }
@keyframes shimmer { 0%, 100% { opacity: .85; } 50% { opacity: 1; } }

/* The plane and its contrail */
.flight { position: absolute; left: 0; right: 0; top: max(62%, 490px); height: 0; }
.plane { position: absolute; right: 12%; top: -60px; width: min(380px, 62vw); filter: drop-shadow(0 18px 18px #0d235044); }
.plane svg { display: block; width: 100%; height: auto; }
.trail { position: absolute; top: -6px; right: calc(12% + min(380px, 62vw) * .82); left: 0; height: 10px; }
.trail i { position: absolute; left: 0; right: 0; height: 3px; border-radius: 3px; background: linear-gradient(90deg, transparent, #ffffffb3 75%, #fffffff2); }
.trail i:nth-child(2) { top: 7px; opacity: .75; }

/* Words */
main { position: relative; z-index: 2; min-height: 100svh; display: flex; flex-direction: column; align-items: center; text-align: center;
  padding: max(28px, env(safe-area-inset-top)) 20px 20px; }
.back { position: absolute; left: 16px; top: max(14px, env(safe-area-inset-top)); font-size: 14px; text-decoration: none; opacity: .85; padding: 6px 4px; }
.back:hover { opacity: 1; text-decoration: underline; }
.eyebrow { margin: 6vh 0 6px; font: 500 12px/1.4 "IBM Plex Mono", monospace; letter-spacing: .2em; text-transform: uppercase; color: #cfe0ff; }
h1 { margin: 0; font: 700 clamp(64px, 15vw, 150px)/.9 "Barlow Condensed", "Arial Narrow", sans-serif; letter-spacing: .06em; text-transform: uppercase;
  text-shadow: 0 6px 30px #0d235080; }
.tagline { margin: 12px auto 0; max-width: 34ch; font-size: clamp(17px, 2.4vw, 21px); color: #eaf1ff; }
.cta { margin-top: 22px; display: inline-flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 26px; border-radius: 999px;
  background: #fff; color: #142c5c; font: 700 22px/1 "Barlow Condensed", sans-serif; letter-spacing: .08em; text-transform: uppercase; text-decoration: none;
  box-shadow: 0 10px 30px #0d235055; transition: transform .15s; }
.cta:hover { transform: translateY(-2px); }
.cta:focus-visible, .back:focus-visible { outline: 3px solid #ffd27a; outline-offset: 3px; }
.cta .arrow { transition: transform .15s; }
.cta:hover .arrow { transform: translateX(4px); }
.chips { margin-top: 16px; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.chips span { font: 500 12.5px/1 "IBM Plex Mono", monospace; letter-spacing: .04em; padding: 7px 11px; border-radius: 999px; background: #0d23505c; border: 1px solid #ffffff40; }
.demo { position: absolute; bottom: max(14px, env(safe-area-inset-bottom)); left: 0; right: 0; margin: 0; font-size: 13px; color: #142c5c; text-align: center; padding: 0 16px; }
@media (max-width: 640px) {
  .flight { top: 66%; }
  .plane { right: 6%; }
  .trail { right: calc(6% + min(380px, 62vw) * .82); }
}
@media (max-height: 640px) { .flight { top: 74%; } .eyebrow { margin-top: 3vh; } }
</style>
</head>
<body>
<div class="sky" aria-hidden="true">
  <div class="stars"></div>
  <div class="sun"></div>
  <div class="clouds far"></div>
  <div class="flight">
    <div class="trail"><i></i><i></i></div>
    <div class="plane">
      <svg viewBox="0 0 400 140" role="presentation">
        <defs>
          <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#eef2f9"/><stop offset="1" stop-color="#c9d2e3"/></linearGradient>
          <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#dfe5f0"/><stop offset="1" stop-color="#aeb9cf"/></linearGradient>
        </defs>
        <!-- far wing and tailplane, behind the body -->
        <path d="M196 66 L238 30 L258 30 L232 66 Z" fill="#b9c3d8"/>
        <path d="M62 64 L30 50 L42 48 L88 62 Z" fill="#b9c3d8"/>
        <!-- tail fin -->
        <path d="M66 60 L36 12 Q34 8 40 8 L58 8 Q63 8 66 12 L112 58 Z" fill="#9775fa"/>
        <path d="M44 14 L60 14 L82 40 L64 40 Z" fill="#b39cff" opacity=".55"/>
        <!-- body -->
        <path d="M62 56 L322 54 C356 54 382 61 393 69 C384 78 358 86 324 86 L76 86 C60 86 48 82 41 76 L34 66 C38 59 48 56 62 56 Z" fill="url(#body)"/>
        <path d="M60 79 L330 79 C356 79 372 76 384 74" stroke="#9775fa" stroke-width="3" fill="none" stroke-linecap="round" opacity=".9"/>
        <!-- windows -->
        <g fill="#33405e" id="windows"></g>
        <path d="M351 61 L372 62.5 L381 68 L356 68 Z" fill="#33405e"/>
        <!-- near tailplane -->
        <path d="M58 72 L20 88 Q16 90 22 91 L40 92 L94 78 Z" fill="url(#wing)"/>
        <!-- near wing and engine -->
        <path d="M206 76 L152 124 Q148 128 154 128 L176 128 L258 80 Z" fill="url(#wing)"/>
        <rect x="170" y="90" width="52" height="18" rx="9" fill="#e4e9f3"/>
        <rect x="170" y="90" width="12" height="18" rx="6" fill="#5b6785"/>
        <path d="M222 93 L232 96 L232 102 L222 105 Z" fill="#c4cde0"/>
      </svg>
    </div>
  </div>
  <div class="clouds mid"></div>
  <div class="clouds near"></div>
</div>

<main>
  <a class="back" href="/home/#polished">← Off the Wall</a>
  <p class="eyebrow">Flight &amp; hotel log</p>
  <h1>Contrail</h1>
  <p class="tagline">Every flight and stay on one map, and the lounges your cards get you into.</p>
  <a class="cta" href="/contrail/">Open Contrail <span class="arrow" aria-hidden="true">→</span></a>
  <div class="chips"><span>Route map</span><span>Lounge finder</span><span>Travel analytics</span></div>
  <p class="demo">A demo with sample trips: click around, nothing is saved.</p>
</main>

<script>
// Windows along the plane, and the cloud tiles: puffs of overlapping circles with flat bottoms
document.getElementById('windows').innerHTML = Array.from({ length: 18 }, (_, i) => `<circle cx="${118 + i * 12}" cy="66" r="2.6"/>`).join('');
function cloudTile(w, h, n, seed, scale) {
  let s = seed; const r = () => ((s = (s * 9301 + 49297) % 233280) / 233280);
  let out = '';
  for (let i = 0; i < n; i++) {
    const cx = (i + 0.2 + r() * 0.6) * (w / n), base = h * (0.55 + r() * 0.35), size = scale * (0.7 + r() * 0.6);
    const puffs = [[-1.6, 0, 0.9], [-0.7, -0.55, 1.15], [0.35, -0.75, 1.3], [1.35, -0.3, 1], [2.1, 0.05, 0.8]];
    out += `<g fill="#fff">${puffs.map(([dx, dy, rr]) => `<circle cx="${(cx + dx * size).toFixed(1)}" cy="${(base + dy * size).toFixed(1)}" r="${(rr * size).toFixed(1)}"/>`).join('')}<rect x="${(cx - 2.4 * size).toFixed(1)}" y="${base.toFixed(1)}" width="${(4.8 * size).toFixed(1)}" height="${(size * 1.1).toFixed(1)}" rx="${(size * 0.5).toFixed(1)}"/></g>`;
    // A shadowed underside so the clouds look round
    out += `<ellipse cx="${(cx + 0.2 * size).toFixed(1)}" cy="${(base + size * 0.95).toFixed(1)}" rx="${(2.3 * size).toFixed(1)}" ry="${(size * 0.28).toFixed(1)}" fill="#c9cfe6" opacity=".55"/>`;
  }
  return `url("data:image/svg+xml,${encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='${w}' height='${h}' viewBox='0 0 ${w} ${h}'>${out}</svg>`)}")`;
}
for (const [sel, w, h, n, seed, scale] of [['.far', 900, 200, 5, 7, 22], ['.mid', 1300, 260, 5, 19, 34], ['.near', 1700, 340, 4, 31, 58]]) {
  const el = document.querySelector(sel);
  el.style.backgroundImage = cloudTile(w, h, n, seed, scale);
  el.style.backgroundSize = `${w}px ${h}px`;
  el.style.width = `calc(100% + ${w}px)`;
  el.style.setProperty('--tile', `${w}px`);
}
document.addEventListener('visibilitychange', () => document.documentElement.style.setProperty('--play', document.hidden ? 'paused' : 'running'));
</script>
</body>
</html>
