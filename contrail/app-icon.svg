      <path d="M0 -132 C16 -132 20 -110 20 -88 L20 84 L0 118 L-20 84 L-20 -88 C-20 -110 -16 -132 0 -132 Z"/>
      <path d="M20 -24 L142 28 L142 54 L20 30 Z M-20 -24 L-142 28 L-142 54 L-20 30 Z"/>
    </g>
    <path d="M20 -24 L142 28 L142 54 L20 30 Z M-20 -24 L-142 28 L-142 54 L-20 30 Z" fill="#cfc6f7"/>
    <path d="M14 80 L60 108 L60 122 L10 112 Z M-14 80 L-60 108 L-60 122 L-10 112 Z" fill="#cfc6f7"/>
    <path d="M0 -132 C16 -132 20 -110 20 -88 L20 84 L0 118 L-20 84 L-20 -88 C-20 -110 -16 -132 0 -132 Z" fill="url(#body)"/>
    <path d="M-9 -104 C-6 -114 6 -114 9 -104 L9 -92 L-9 -92 Z" fill="#7a5ce6"/>
    <rect x="56" y="22" width="18" height="34" rx="8" fill="#9b86f0"/><rect x="-74" y="22" width="18" height="34" rx="8" fill="#9b86f0"/>
