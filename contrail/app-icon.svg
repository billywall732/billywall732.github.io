<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Contrail home-screen icon: a plane climbing to the upper right, two contrails behind it, in
       the Off the Wall app-icon style (one object on a dark glow in the app's color, two swooshes) -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%"><stop offset="0" stop-color="#4b33a3"/><stop offset="1" stop-color="#0b0820"/></radialGradient>
    <linearGradient id="trail" gradientUnits="userSpaceOnUse" x1="300" y1="250" x2="170" y2="380"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d9d3f5"/></linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g fill="none" stroke="#fff" stroke-width="14" stroke-linecap="round" stroke-opacity=".85">
    <path d="M358 79 A205 205 0 0 1 449 186"/><path d="M154 434 A205 205 0 0 1 63 326"/>
  </g>
  <g fill="none" stroke="url(#trail)" stroke-linecap="round">
    <path d="M318 292 L190 420" stroke-width="14"/>
    <path d="M226 200 L98 328" stroke-width="14"/>
  </g>
  <g transform="translate(296 216) rotate(45)">
